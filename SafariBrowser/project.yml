name: SafariBrowser
options:
  bundleIdPrefix: com.safaribrowser
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SafariBrowserCore:
    path: SafariBrowserCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  SafariBrowser:
    type: application
    platform: iOS
    sources:
      - SafariBrowser
    info:
      path: SafariBrowser/Info.plist
      properties:
        CFBundleDisplayName: SafariBrowser
    dependencies:
      - package: SafariBrowserCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safaribrowser.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  SafariBrowserCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SafariBrowserCore/Tests
    dependencies:
      - package: SafariBrowserCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safaribrowser.core.tests

schemes:
  SafariBrowser:
    build:
      targets:
        SafariBrowser: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SafariBrowserCoreTests
