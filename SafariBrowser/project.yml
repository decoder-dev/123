name: SafariBrowser
options:
  bundleIdPrefix: com.safaribrowser
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Sideload: release

packages:
  SafariBrowserCore:
    path: SafariBrowserCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 1.0.0-beta.2
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""

targets:
  SafariBrowser:
    type: application
    platform: iOS
    sources:
      - SafariBrowser
    info:
      path: SafariBrowser/Info.plist
      properties:
        CFBundleDisplayName: SafariBrowser
    entitlements:
      path: SafariBrowser/SafariBrowser.entitlements
    dependencies:
      - package: SafariBrowserCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safaribrowser.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Sideload:
          CODE_SIGN_ENTITLEMENTS: SafariBrowser/SafariBrowser.sideload.entitlements

  SafariBrowserShare:
    type: app-extension
    platform: iOS
    sources:
      - SafariBrowserShare
    info:
      path: SafariBrowserShare/Info.plist
    entitlements:
      path: SafariBrowserShare/SafariBrowserShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safaribrowser.app.share
        SKIP_INSTALL: YES

  SafariBrowserWidget:
    type: app-extension
    platform: iOS
    sources:
      - SafariBrowserWidget
    info:
      path: SafariBrowserWidget/Info.plist
    entitlements:
      path: SafariBrowserWidget/SafariBrowserWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safaribrowser.app.widget
        SKIP_INSTALL: YES

  SafariBrowserCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SafariBrowserCore/Tests
    dependencies:
      - package: SafariBrowserCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safaribrowser.core.tests

schemes:
  SafariBrowser:
    build:
      targets:
        SafariBrowser: all
        SafariBrowserShare: all
        SafariBrowserWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SafariBrowserCoreTests
    archive:
      config: Sideload
