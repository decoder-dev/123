name: iOS Pre-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: SafariBrowser
        run: xcodegen generate

      - name: Resolve iOS Simulator
        id: sim
        run: |
          DEST=$(python3 <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          for runtime in sorted(data.get("devices", {}), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data["devices"][runtime]:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(f"platform=iOS Simulator,id={d['udid']}")
                      sys.exit(0)
          sys.exit(1)
          PY
          )
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEST"

      - name: Run unit tests
        working-directory: SafariBrowser
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SafariBrowser \
            -destination "${{ steps.sim.outputs.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release (Simulator)
        working-directory: SafariBrowser
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SafariBrowser \
            -destination "${{ steps.sim.outputs.destination }}" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator build
        run: |
          APP=$(find SafariBrowser/build/DerivedData -name 'SafariBrowser.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "SafariBrowser.app not found"
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/SafariBrowser-Simulator.zip
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafariBrowser-Simulator
          path: dist/SafariBrowser-Simulator.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SafariBrowser-Simulator
          path: dist

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/SafariBrowser-Simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
