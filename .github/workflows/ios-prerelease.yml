name: iOS Pre-release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: SafariBrowser
        run: xcodegen generate

      - name: Resolve iOS Simulator
        id: sim
        run: |
          DEST=$(python3 <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          for runtime in sorted(data.get("devices", {}), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data["devices"][runtime]:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(f"platform=iOS Simulator,id={d['udid']}")
                      sys.exit(0)
          sys.exit(1)
          PY
          )
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: SafariBrowser
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SafariBrowser \
            -destination "${{ steps.sim.outputs.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  build-ipa:
    name: Build unsigned IPA
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        working-directory: SafariBrowser
        run: |
          VERSION="$(awk '/^ *MARKETING_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building SafariBrowser $VERSION"

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: SafariBrowser
        run: xcodegen generate

      - name: Archive unsigned iOS application
        working-directory: SafariBrowser
        run: |
          set -o pipefail
          xcodebuild \
            -project SafariBrowser.xcodeproj \
            -scheme SafariBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/SafariBrowser.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        working-directory: SafariBrowser
        run: grep -E '(^| )error:' release-build.log | tail -30 || true

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/SafariBrowser/build/SafariBrowser.xcarchive/Products/Applications/SafariBrowser.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/SafariBrowser-$VERSION-unsigned.ipa"
          bash ./scripts/package_unsigned_ipa.sh --strip-extensions \
            "$APP_PATH" \
            "$PWD/artifacts/SafariBrowser-$VERSION-iphone-unsigned.ipa"
          ls -la artifacts/

      - name: Publish GitHub pre-release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() {
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then return 1; fi
              sleep "$((attempt * 10))"
              attempt=$((attempt + 1))
            done
          }
          ASSETS=(
            "$PWD/artifacts/SafariBrowser-$VERSION-iphone-unsigned.ipa"
            "$PWD/artifacts/SafariBrowser-$VERSION-unsigned.ipa"
          )
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          # SafariBrowser $VERSION (pre-release)

          Native iOS browser (iOS 18.4+, Swift 6, WKWebView).

          ## Установка

          IPA **не подписан** в CI — подпись на устройстве вашим Apple ID:

          - **ESign**, **Sideloadly**, **Feather**, **AltStore**
          - Или Xcode → Devices → Install App

          Файлы:
          - \`SafariBrowser-$VERSION-iphone-unsigned.ipa\` — без расширений (Share/Widget), проще для sideload
          - \`SafariBrowser-$VERSION-unsigned.ipa\` — полная сборка с расширениями

          ## Сборка из исходников

          \`\`\`bash
          cd SafariBrowser && brew install xcodegen && xcodegen generate
          open SafariBrowser.xcodeproj
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            retry gh release upload "$TAG" "${ASSETS[@]}" --clobber
            retry gh release edit "$TAG" --title "SafariBrowser $VERSION" --notes-file "$NOTES" --prerelease
          else
            retry gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "SafariBrowser $VERSION" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload IPA artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: SafariBrowser-${{ env.VERSION }}-unsigned
          path: |
            artifacts/SafariBrowser-${{ env.VERSION }}-iphone-unsigned.ipa
            artifacts/SafariBrowser-${{ env.VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
